<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Node.js Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- SECTION 1: AUTHENTICATION WINDOW -->
    <div id="authContainer" class="card">
        <h2 id="authTitle">Login to Your Account</h2>
        <form id="authForm">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" id="authBtn">Sign In</button>
        </form>
        <p id="toggleAuthText">Don't have an account? <span id="toggleAuth" onclick="toggleAuthMode()">Sign Up</span></p>
    </div>

    <!-- SECTION 2: PRIVATE DASHBOARD (Hidden by Default) -->
    <div id="dashboardContainer" class="card hidden">
        <div class="dashboard-header">
            <h2>Cloud Log Console</h2>
            <button onclick="logout()" class="btn-danger small">Logout</button>
        </div>

        <!-- Submit new log -->
        <form id="logForm">
            <input type="text" id="logText" placeholder="Write a new cloud entry..." required>
            <button type="submit">Submit Entry</button>
        </form>

        <!-- View existing logs -->
        <h3>Stored Cloud Logs (<span id="logCount">0</span>)</h3>
        <div id="logsDisplay">Loading your logs securely...</div>
        
        <button onclick="clearAllLogs()" class="btn-danger width-100">🗑️ Clear Cloud Database</button>

        <!-- Upload Module Inside Private Dashboard -->
<div style="background: #334155; padding: 15px; border-radius: 6px; margin: 15px 0; border: 1px solid #475569;">
    <h4 style="margin-top:0; color: #38bdf8;">Upload Profile Picture (Max 2MB)</h4>
    <form id="uploadForm" enctype="multipart/form-data">
        <!-- The 'name' attribute must match 'myFile' in your server code -->
        <input type="file" id="fileInput" name="myFile" accept="image/*" required style="border:none; padding:5px; background:none;">
        <button type="submit" style="background:#22c55e; color:#fff;">📤 Upload Image</button>
    </form>
    <div id="uploadStatus" style="font-size:13px; color:#cbd5e1; font-family:monospace;"></div>
</div>

    </div>

        <!-- Add this right before script.js -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
