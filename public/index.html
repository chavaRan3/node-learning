<!DOCTYPE html>
<html lang="en">
<head>
    <title>Node.js Form Submission</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <h1>Submit Data to Node.js Backend</h1>
    <!-- The form sends data to /submit-form using the POST method -->
    <form action="/submit-form" method="POST">
        <label for="userText">Type something:</label>
        <input type="text" id="userText" name="userText" required>
        <button type="submit">Send to Server</button>
    </form>
</body>
</html>
